<!DOCTYPE html>
<html>
<head>
    <title>Таблица</title>

    <!--Подключает React production-->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!--Для JSX-->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Данные
        const people = [
            {id: "0", name: "Иванов Александр Викторович"},
            {id: "1", name: "Абрамов Евгений Анатольевич"},
            {id: "2", name: "Хрулёв Иван Сергеевич"},
            {id: "3", name: "Смирнов Ярослав Динисович"},
            {id: "4", name: "Бондарев Павел Сергеевич"},
            {id: "5", name: "Брежнева Вера Олеговна"},
            {id: "6", name: "Тетеря Олег Анатольевич"},
            {id: "7", name: "Иванов Артём Андреевич"},
            {id: "8", name: "Пилясов Виктор Евгеньевич"},
            {id: "9", name: "Кучин Александр Сергеевич"},
            {id: "10", name: "Трудобухова Ольга Олеговна"}
        ];

        const time = [
            ["0", "2025-12-08", "8:55", "17:00"],
            ["0", "2025-12-09", "8:55", "17:00"],
            ["0", "2025-12-10", "8:55", "17:00"],
            ["1", "2025-12-08", "8:55", "17:00"],
            ["1", "2025-12-09", "9:00", "17:00"],
            ["1", "2025-12-10", "8:49", "17:00"],
            ["2", "2025-12-08", "10:50", "17:00"],
            ["2", "2025-12-09", "9:02", "17:00"],
            ["2", "2025-12-10", "9:00", "17:00"],
            ["3", "2025-12-08", "8:55", "17:00"],
            ["3", "2025-12-09", "8:55", "17:00"],
            ["3", "2025-12-10", "8:55", "17:00"],
            ["4", "2025-12-08", "9:00", "17:00"],
            ["4", "2025-12-09", "9:00", "17:00"],
            ["4", "2025-12-10", "10:00", "17:00"],
            ["5", "2025-12-08", "8:55", "17:00"],
            ["5", "2025-12-09", "8:55", "17:00"],
            ["5", "2025-12-10", "8:55", "17:00"],
            ["6", "2025-12-08", "8:55", "17:00"],
            ["6", "2025-12-09", "8:55", "17:00"],
            ["6", "2025-12-10", "8:55", "17:00"],
            ["7", "2025-12-08", "8:55", "17:00"],
            ["7", "2025-12-09", "8:55", "17:00"],
            ["7", "2025-12-10", "8:55", "17:00"],
            ["8", "2025-12-08", "8:55", "17:00"],
            ["8", "2025-12-09", "8:55", "17:00"],
            ["8", "2025-12-10", "8:55", "17:00"],
            ["9", "2025-12-08", "8:55", "17:00"],
            ["9", "2025-12-09", "8:55", "17:00"],
            ["9", "2025-12-10", "8:55", "17:00"],
            ["10", "2025-12-08", "8:55", "17:00"],
            ["10", "2025-12-09", "8:55", "17:00"],
            ["10", "2025-12-10", "8:55", "17:00"],
        ];

        let dates = ["2025-12-08", "2025-12-09", "2025-12-10"];

        //ищет время по айди и дате
        function poiskTime(uid, d) {
            for (let i = 0; i < time.length; i++) {
                if (time[i][0] == uid && time[i][1] == d) {
                    return time[i][2] + "-" + time[i][3];
                }
            }
            return "нет";
        }

        //таблица
        function Tablica() {
            //рисует таблицу
         return (
             <div>
                 <center>
                     <h2>Приход и уход сотрудников</h2>

                    <table id="timeTable" border="1">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>ФИО</th>
                                        
                                    {dates.map(function(data) {
                                        return <th key={data}>{data}</th>
                                    })}
                                </tr>
                            </thead>
                        <tbody>
                                   
                                {people.map(function(chelovek) {
                                    return (
                                        <tr key={chelovek.id}>
                                            <td>{chelovek.id}</td>
                                            <td>{chelovek.name}</td>
                                            
                                         
                                            {dates.map(function(data) {
                                                let vremya = poiskTime(chelovek.id, data);
                                                return <td key={data}>{vremya}</td>
                                            })}
                                        </tr>
                                    );
                                })}
                        </tbody>
                    </table>
                 </center>
             </div>
         );
        }

        let root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Tablica />);   //запуск

    </script>
</body>
</html>
